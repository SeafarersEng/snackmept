<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEPT Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Myanmar Text', system-ui, sans-serif;
      background: linear-gradient(135deg, #0a1a3a 0%, #0f2f5f 50%, #0a1a3a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 38px 32px 32px;
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.7);
    }

    .login-header { text-align: center; margin-bottom: 28px; }
    .login-header .logo-circle {
      width: 68px; height: 68px;
      margin: 0 auto 14px;
      background: linear-gradient(135deg, #3b82f6, #06b6d4);
      border-radius: 20px;
      display: grid; place-items: center;
      font-size: 30px; color: #fff; font-weight: 800;
      position: relative;
      box-shadow: 0 12px 30px -8px rgba(59, 130, 246, 0.9);
    }
    .login-header .logo-circle::after {
      content: "⚓";
      position: absolute; font-size: 14px;
      bottom: 2px; right: 4px;
    }
    .login-header h1 {
      font-size: 22px; color: #fff; font-weight: 800;
      margin-bottom: 4px;
    }
    .login-header .subtitle {
      font-size: 11.5px; color: #93b4dd;
      letter-spacing: 2.4px; text-transform: uppercase; font-weight: 600;
    }

    .input-group { margin-bottom: 18px; }
    .input-group label {
      display: block; font-size: 13px; font-weight: 600;
      color: #bfdbfe; margin-bottom: 7px; text-align: center;
    }
    .input-group input {
      width: 100%; padding: 15px 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff; font-size: 16px;
      font-family: 'SF Mono', 'Consolas', monospace;
      letter-spacing: 1.2px; text-align: center;
      outline: none; transition: 0.25s;
    }
    .input-group input:focus {
      border-color: rgba(59, 130, 246, 0.75);
      background: rgba(59, 130, 246, 0.1);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }
    .input-group .hint {
      display: block; font-size: 11.5px;
      color: #8fa6c4; margin-top: 8px; text-align: center;
    }

    .btn-primary {
      width: 100%; padding: 15px;
      border: none; border-radius: 100px;
      background: linear-gradient(120deg, #3b82f6, #06b6d4);
      color: #fff; font-size: 15.5px; font-weight: 700;
      cursor: pointer; transition: 0.3s;
      display: flex; align-items: center; justify-content: center; gap: 9px;
    }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

    .login-error {
      margin-top: 16px; padding: 13px 16px;
      border-radius: 12px; font-size: 13.5px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fecaca; display: none; text-align: center;
    }
    .login-error.show { display: block; }
    .login-error.success {
      background: rgba(34, 197, 94, 0.12);
      border-color: rgba(34, 197, 94, 0.4);
      color: #bbf7d0;
    }

    .device-pill {
      display: flex; align-items: center; justify-content: center;
      gap: 7px; margin-top: 14px; padding: 8px 14px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 100px;
      font-size: 11.5px; color: #bbf7d0;
      font-family: 'SF Mono', monospace;
    }
    .device-pill .dev-id { color: #fff; font-weight: 700; }

    .account-info {
      margin-top: 22px; padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
    }
    .account-info p { font-size: 13px; color: #b8c8e0; line-height: 1.8; }
    .telegram-link {
      color: #60a5fa; font-weight: 700;
      text-decoration: none;
      border-bottom: 1px dashed rgba(96, 165, 250, 0.5);
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-header">
      <div class="logo-circle">M</div>
      <h1>MEPT Login</h1>
      <div class="subtitle">Maritime English Test</div>
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="input-group">
        <label for="userId">ID</label>
        <input type="text" id="userId" placeholder="MEPT-XXXX-XXXX" maxlength="30" required>
        <small class="hint">✅ ID တစ်ခုကို Device တစ်ခုမှာသာ Activate လုပ်နိုင်ပါသည်။</small>
      </div>

      <button type="submit" class="btn-primary" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i>
        <span>Login ဝင်မည်</span>
      </button>
      <div id="loginError" class="login-error"></div>
    </form>

    <div class="device-pill">
      <i class="fas fa-shield-alt"></i>
      <span>Device:</span>
      <span class="dev-id" id="deviceIdDisplay">...</span>
    </div>

    <div class="account-info">
      <p>
        📱 ID ရယူရန်
        <a href="https://t.me/SNACK129" target="_blank" rel="noopener" class="telegram-link">@SNACK129 Telegram</a>
        သို့ ဆက်သွယ်ပါ။
      </p>
    </div>
  </div>

  <script>
    // ================================================================
    // ✅ Apps Script URL
    // ================================================================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx9B77TpcleetOyE60NkVL_14b30YXbQY_BKc4Anhp_JSfegRu-zZfgWIWhRl5RIh7pzg/exec";

    const form = document.getElementById('loginForm');
    const userIdI = document.getElementById('userId');
    const loginBtn = document.getElementById('loginBtn');
    const errorBox = document.getElementById('loginError');
    const deviceIdDisp = document.getElementById('deviceIdDisplay');

    // ================================================================
    // DEVICE ID
    // ================================================================
    function generateDeviceId() {
      const parts = [
        navigator.userAgent || '',
        navigator.language || '',
        navigator.platform || '',
        screen.width + 'x' + screen.height,
        screen.colorDepth || '',
        new Date().getTimezoneOffset(),
        navigator.hardwareConcurrency || '',
        navigator.deviceMemory || '',
        navigator.maxTouchPoints || ''
      ];
      try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        ctx.textBaseline = 'top';
        ctx.font = '14px Arial';
        ctx.fillStyle = '#f60';
        ctx.fillRect(125, 1, 62, 20);
        ctx.fillStyle = '#069';
        ctx.fillText('MEPT-FP', 2, 15);
        parts.push(canvas.toDataURL());
      } catch (e) { parts.push('canvas-err'); }

      const combined = parts.join('|');
      let hash = 2166136261;
      for (let i = 0; i < combined.length; i++) {
        hash ^= combined.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      hash = hash >>> 0;
      return 'DEV-' + hash.toString(36).toUpperCase().padStart(7, '0');
    }

    const DEVICE_ID = generateDeviceId();
    deviceIdDisp.textContent = DEVICE_ID;

    // ================================================================
    // HELPERS
    // ================================================================
    function showError(msg, type) {
      errorBox.textContent = msg;
      errorBox.className = 'login-error show' + (type ? ' ' + type : '');
    }
    function clearError() { errorBox.className = 'login-error'; errorBox.textContent = ''; }
    function setLoading(on) {
      loginBtn.disabled = on;
      loginBtn.innerHTML = on
        ? '<i class="fas fa-spinner fa-spin"></i><span>စစ်ဆေးနေသည်...</span>'
        : '<i class="fas fa-sign-in-alt"></i><span>Login ဝင်မည်</span>';
    }

    // ================================================================
    // FORM SUBMIT
    // ================================================================
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      clearError();

      const userId = userIdI.value.trim().toUpperCase();
      if (!userId || userId.length < 4) {
        showError('⚠️ ID ပုံစံ မမှန်ပါ။ (ဥပမာ — MEPT-2025-001)');
        return;
      }

      setLoading(true);

      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ id: userId, deviceId: DEVICE_ID })
        });
        const data = await res.json();
        setLoading(false);

        if (data.status === 'success') {
          // ✅ Session သိမ်း (learning.html က ဒါကို စစ်မယ်)
          localStorage.setItem('mept_session', JSON.stringify({
            id: data.id || userId,
            deviceId: DEVICE_ID,
            plan: data.plan || 'Premium',
            expiry: data.expiry || '',
            loginAt: new Date().toISOString()
          }));

          showError('✅ Login အောင်မြင်သည်။', 'success');

          // 👉 learning.html သို့ သွား
          setTimeout(() => {
            window.location.href = 'learning.html';
          }, 700);
        }
        else if (data.status === 'bind') {
          showError('🔗 Device ID အသစ်ကို Bind လုပ်နေသည်...');
          setTimeout(() => bindDevice(userId), 600);
        }
        else {
          showError('❌ ' + (data.message || 'ID မှားနေပါသည်။'));
        }
      } catch (err) {
        setLoading(false);
        showError('⚠️ ကွန်ရက် အမှား ဖြစ်ပွားသည်။ Internet စစ်ပါ။');
      }
    });

    // ================================================================
    // BIND DEVICE
    // ================================================================
    async function bindDevice(userId) {
      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ id: userId, deviceId: DEVICE_ID, action: 'bind' })
        });
        const data = await res.json();

        if (data.status === 'success') {
          localStorage.setItem('mept_session', JSON.stringify({
            id: data.id || userId,
            deviceId: DEVICE_ID,
            plan: data.plan || 'Premium',
            expiry: data.expiry || '',
            loginAt: new Date().toISOString()
          }));
          showError('✅ Device Bind အောင်မြင်သည်။', 'success');
          setTimeout(() => { window.location.href = 'learning.html'; }, 700);
        } else {
          showError('❌ ' + (data.message || 'Device Bind မအောင်မြင်ပါ။'));
        }
      } catch (err) {
        showError('⚠️ Device Bind လုပ်ရာတွင် အမှားရှိသည်။');
      }
    }

    // ================================================================
    // ✅ AUTO-REDIRECT ကို ဖြုတ်ထားသည်
    // Session ရှိရင်လည်း Login form ကို ဒီအတိုင်း ပြမယ်
    // (User ကိုယ်တိုင် Login ဝင်ရမယ်)
    // ================================================================
    // ဒီ code ကို ဖြုတ်ထားတယ် 👇
    /*
    (function () {
      const s = localStorage.getItem('mept_session');
      if (s) {
        const session = JSON.parse(s);
        if (session && session.deviceId === DEVICE_ID) {
          window.location.replace('learning.html');
        }
      }
    })();
    */

    // ================================================================
    // INPUT HELPERS
    // ================================================================
    userIdI.addEventListener('input', function () {
      this.value = this.value.toUpperCase();
      if (errorBox.classList.contains('show') && !errorBox.classList.contains('success')) {
        clearError();
      }
    });
  </script>

</body>
</html>
